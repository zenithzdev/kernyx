[package]
name = "kernyx"
version = "2.0.0"
edition = "2021"
authors = ["Kernyx Contributors"]
description = "Adaptive Linux Performance Optimization Engine"
license = "MIT"
repository = "https://github.com/zenithzcloud/kernyx"

[[bin]]
name = "kernyx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
