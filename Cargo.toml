[package]
name = "kernyx"
version = "1.0.0"
edition = "2021"
authors = ["Zenithz Dev"]
description = "Adaptive Linux Performance Optimization Engine"
license = "MIT"
repository = "https://github.com/zenithzdev/kernyx"

[[bin]]
name = "kernyx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
